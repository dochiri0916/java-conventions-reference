spring:
  application:
    name: tool-test-lab

  task:
    scheduling:
      pool:
        size: 2

  # JDK Dynamic Proxy (final service + interface 기반)
  aop:
    proxy-target-class: false

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

api:
  problem:
    base-uri: https://api.example.com

# Server
server:
  port: 18080

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

time:
  timezone: Asia/Seoul

messaging:
  transport: local
  outbox:
    enabled: true
    poll-interval-ms: 250
    send-timeout-ms: 10000
    cleanup:
      enabled: true
      retention-days: 7
      interval-ms: 600000
      batch-size: 1000
      max-batches: 10
  snapshots:
    publish-on-startup: true

# Logging
logging:
  level:
    root: INFO
    com.dochiri.tooltestlab: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
