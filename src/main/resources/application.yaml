spring:
  application:
    name: tool-test-lab

  # JDK Dynamic Proxy (final service + interface 기반)
  aop:
    proxy-target-class: false

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

api:
  problem:
    base-uri: https://api.example.com

# Server
server:
  port: 18080

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

time:
  timezone: Asia/Seoul

messaging:
  outbox:
    enabled: true
    poll-interval-ms: 250
  snapshots:
    publish-on-startup: true

# Logging
logging:
  level:
    root: INFO
    com.dochiri.tooltestlab: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
